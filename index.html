<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Documents</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #fff;
      color: #222;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .files {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 300px;
    }

    a {
      color: #222;
      text-decoration: none;
      padding: 5px 8px;
      border-radius: 3px;
    }

    a:hover {
      background: #f0f0f0;
      text-decoration: underline;
    }

    .pdf-icon {
      display: inline-block;
      width: 24px;
      height: 24px;
      margin-right: 8px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <h1>PDF Documents</h1>

  <div class="files">
    <a href="01.pdf" target="_blank"><span class="pdf-icon">📄</span>01.pdf</a>
    <a href="02d.pdf" target="_blank"><span class="pdf-icon">📄</span>02d.pdf</a>
    <a href="03d.pdf" target="_blank"><span class="pdf-icon">📄</span>03d.pdf</a>
    <a href="04.pdf" target="_blank"><span class="pdf-icon">📄</span>04.pdf</a>
    <a href="05d.pdf" target="_blank"><span class="pdf-icon">📄</span>05d.pdf</a>
    <a href="06.pdf" target="_blank"><span class="pdf-icon">📄</span>06.pdf</a>
  </div>
</body>
</html>
